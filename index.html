<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <!--
      Brand-neutral on purpose: one build serves every domain, so the brand is
      resolved from the hostname at runtime and these tags are rewritten by
      src/config/applyBrandToDocument.ts.
    -->
    <title>Réservation bien-être</title>
    <meta name="description" content="Réservez vos soins bien-être." />
    <meta name="author" content="" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Réservation bien-être" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      if (window.location.pathname.startsWith('/admin-pwa')) {
        document.querySelector('link[rel="manifest"]').href = '/admin-manifest.webmanifest';
      }
      // Distinct favicon on non-prod hosts to differentiate from PROD. Listed
      // explicitly rather than "anything but app.eiaspa.fr": every client brand
      // has its own production domain now, and none of them is a dev host.
      var host = window.location.hostname;
      var isDevHost = host === 'localhost' || host === '127.0.0.1' || host.startsWith('apptest.');
      if (isDevHost) {
        var svgIcon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
        if (svgIcon) svgIcon.href = '/favicon-dev.svg';
      }
    </script>

    <!-- Preload critical font -->
    <link rel="preload" href="/fonts/Kormelink.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect hints for external resources -->
    <link rel="preconnect" href="https://cdn.onesignal.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.onesignal.com" />
    <link rel="preconnect" href="https://api.onesignal.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.onesignal.com" />

    <!-- Rewritten at runtime once the hostname resolves to a brand. -->
    <meta property="og:title" content="Réservation bien-être" />
    <meta property="og:description" content="Réservez vos soins bien-être." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
